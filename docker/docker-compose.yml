version: '3.8'

services:
  redis:
    image: redis/redis-stack:latest
    container_name: rtfm-redis
    ports:
      - '6379:6379'
      - '8001:8001'
    volumes:
      - redis_data:/data
    environment:
      - REDIS_ARGS=--save 60 1
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  redis_data:
